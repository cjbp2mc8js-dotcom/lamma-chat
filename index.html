function show(page){if(page==='wallet')page='shop';window.closeLammaTopup?.();document.getElementById('royalDetail')?.remove();document.querySelectorAll('#home,#room,#other').forEach(el=>el.classList.add('hidden'));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===(page==='royal'?'profile':page)));if(page==='room'){document.getElementById('other').classList.remove('hidden');document.getElementById('other').innerHTML='<h1>👑 المجالس الملكية</h1><div id="roomsArea">جاري تحميل المجالس...</div>';window.renderRooms?.();}else if(page==='home'){document.getElementById(page).classList.remove('hidden');}else{const o=document.getElementById('other');o.classList.remove('hidden');let title={games:'🎮 الألعاب',friends:'👥 الأصدقاء',tasks:'📋 المهام',shop:'🛒 المتجر',royal:'مستوى رويال',messages:'✉️ الرسائل',profile:'👑 حسابي',settings:'⚙️ الإعدادات'}[page]||page;let content='';if(page==='games')content=window.renderLammaGames();if(page==='friends')content='<div class="item">👥 الأصدقاء <b>0 / 200</b></div><p>البحث والإضافة والموافقة تحتاج ربط الحسابات الحقيقي.</p>';if(page==='tasks')content=['🎁 صندوق الحضور اليومي','🎮 العب 3 جولات','🏅 احصل على شارة لعبة','🏆 أكمل مهام الأسبوع'].map(t=>`<div class="item">${t}<span>قريباً</span></div>`).join('');if(page==='shop')content=window.renderLammaShop();if(page==='profile')content=window.renderLammaProfile();if(page==='royal')content=window.renderLammaRoyal();if(page==='settings')content='<div class="item">📧 البريد الإلكتروني <b style="overflow-wrap:anywhere">'+safeText(window.lammaUser?.email)+'</b></div><div class="item" style="display:block">🆔 الآيدي الخاص بك<div data-account-id style="direction:ltr;overflow-wrap:anywhere;margin:10px 0;color:#ffdc8b">جاري تحميل الآيدي…</div><button class="btn" data-copy-account-id disabled onclick="copyLammaId()">📋 نسخ الآيدي</button><button class="btn" data-retry-account-id hidden onclick="loadLammaAccountId()">إعادة المحاولة</button></div><div class="item">👤 الصورة الشخصية <button class="btn" onclick="document.getElementById(&#39;avatarUpload&#39;).click()">تغيير الصورة</button></div><div class="item"><button class="btn" onclick="show(&quot;profile&quot;)">👑 حسابي</button></div><div class="item"><button class="btn" style="width:100%;background:linear-gradient(#b43d65,#6c1b43)" onclick="lammaLogout()">🚪 تسجيل الخروج</button></div>';if(page==='messages')content='<p>هنا راح تظهر المحادثات بعد ربط تسجيل الدخول وقاعدة البيانات.</p>';o.innerHTML=`<h1>${title}</h1>${content}${(page==='shop'||page==='profile'||page==='royal'||page==='games')?'':'<p class="note">تسجيل الدخول حقيقي، أما الألعاب والمدفوعات والمحادثات فما زالت تجريبية.</p>'}`;}if(page==='games')window.mountLammaGames?.();if(page==='profile'){window.refreshLammaProfilePhoto?.();}if(page==='profile'||page==='settings'){window.renderLammaAccountId?.();window.loadLammaAccountId?.();}if(page==='shop'||page==='home'){window.paintLammaBalances?.();window.refreshDiamonds?.();}window.scrollTo(0,0)}

function setAvatar(input){const avatarUserUid=window.lammaUser?.uid;const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('اختار صورة فقط');return}const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{if(window.lammaUser?.uid!==avatarUserUid)return;const canvas=document.createElement('canvas');canvas.width=220;canvas.height=220;const ctx=canvas.getContext('2d');const m=Math.min(image.width,image.height);ctx.drawImage(image,(image.width-m)/2,(image.height-m)/2,m,m,0,0,220,220);const data=canvas.toDataURL('image/jpeg',.78);document.getElementById('avatarPreview').style.backgroundImage=`url("${data}")`;try{localStorage.setItem('lammaAvatarDemo:'+ (window.lammaUser?.uid||'guest'),data)}catch(e){}window.refreshLammaProfilePhoto?.(); };image.src=reader.result};reader.readAsDataURL(f)}

<script type="module">
/* In-council voice. Never stores certificates or RTC tokens. */
class RoyalVoice {
 constructor({sdk,token,user,ui}) { Object.assign(this,{sdk,token,user,ui}); this.queue=Promise.resolve();this.epoch=0;this.client=null;this.track=null;this.session=null;this.muted=false;this.outputMuted=false;this.timer=null; }
 serial(fn){const p=this.queue.then(fn);this.queue=p.catch(()=>{});return p;}
 async cleanup(){clearInterval(this.timer);this.timer=null;const track=this.track;this.track=null;if(track){track.stop();track.close();}const client=this.client;this.client=null;if(client){try{await client.leave();}catch{}client.removeAllListeners();}const session=this.session;this.session=null;if(session){try{await this.token('leave',session);}catch{}}this.ui({connected:false,speaking:false,users:[]});}
 join(roomId){const epoch=++this.epoch;return this.serial(async()=>{await this.cleanup();try{const sdk=await this.sdk();if(epoch!==this.epoch)return;const session={roomId,sessionId:crypto.randomUUID()};this.session=session;const data=await this.token('join',session);if(epoch!==this.epoch){await this.cleanup();return;}const c=sdk.createClient({mode:'rtc',codec:'vp8'});this.client=c;
 const users=()=>this.ui({users:c.remoteUsers.map(u=>({uid:u.uid,speaking:!!u.hasAudio}))});
 c.on('user-published',async(u,type)=>{if(type!=='audio'||epoch!==this.epoch)return;try{await c.subscribe(u,type);if(epoch===this.epoch){u.audioTrack?.setVolume(this.outputMuted?0:100);u.audioTrack?.play();users();}}catch{this.ui({message:'تعذر سماع أحد المشاركين؛ جرّب تفعيل السماعة.'});}});
 for(const event of ['user-joined','user-left','user-unpublished'])c.on(event,users);
 c.on('token-privilege-will-expire',()=>this.renew(epoch));
 c.on('token-privilege-did-expire',()=>{if(epoch===this.epoch){this.ui({message:'انتهى اتصال الصوت. اضغط إعادة الاتصال.'});this.leave();}});
 c.on('connection-state-change',(state)=>{if(epoch!==this.epoch)return;if(state==='RECONNECTING')this.ui({message:'جاري استعادة اتصال الصوت...'});if(state==='CONNECTED')this.ui({message:'متصل بالصوت — اضغط على مايك فارغ حتى تحچي.'});if(state==='DISCONNECTED'){this.ui({message:'انقطع الصوت. اضغط إعادة الاتصال.'});this.leave();}});
 await c.join(data.appId,data.channel,data.token,data.uid);if(epoch!==this.epoch){await this.cleanup();return;}
 this.timer=setInterval(()=>this.renew(epoch),300000);this.ui({connected:true,speaking:false,rtcUid:data.uid,outputMuted:this.outputMuted,message:'تسمع المجلس — اضغط على مايك فارغ حتى تحچي.'});users();
