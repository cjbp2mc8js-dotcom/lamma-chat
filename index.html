function safeText(v){return String(v??'غير متاح').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(page){if(page==='friends'){page='messages';window.lammaFriendInitialTab='friends';}if(page==='tasks')page='events';if(page==='wallet')page='shop';document.getElementById('other').dataset.page=page;window.closeLammaTopup?.();document.getElementById('royalDetail')?.remove();document.querySelectorAll('#home,#room,#other').forEach(el=>el.classList.add('hidden'));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===(['profile','royal','settings'].includes(page)?'home':['games','friends','tasks','shop'].includes(page)?'home':page)));if(page==='room'){document.getElementById('other').classList.remove('hidden');document.getElementById('other').innerHTML='<div id="roomsArea">جاري تحميل المجالس...</div>';window.renderRooms?.();}else if(page==='home'){document.getElementById(page).classList.remove('hidden');}else{const o=document.getElementById('other');o.classList.remove('hidden');let title={events:'🎁 الأحداث',games:'🎮 الألعاب',friends:'👥 الأصدقاء',tasks:'📋 المهام',shop:'🛒 المتجر',royal:'مستوى رويال',messages:'✉️ الرسائل',profile:'👑 حسابي',settings:'⚙️ الإعدادات'}[page]||page;let content='';if(page==='games')content=window.renderLammaGames();if(page==='friends')content="<section class=\"app-empty\" aria-label=\"أصدقاؤك بمكان واحد\"><span class=\"app-empty-icon\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 4a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87\"/></svg></span><h2>أصدقاؤك بمكان واحد</h2><p>إضافة الأصدقاء والبحث عنهم قيد التجهيز. تقدر هسه تلتقي بأصحابك بالمجالس الملكية.</p><span class=\"app-status\">قريباً</span></section>";if(page==='events')content=window.renderLammaEvents();if(page==='shop')content=window.renderLammaShop();if(page==='profile')content=window.renderLammaProfile();if(page==='royal')content=window.renderLammaRoyal();if(page==='settings')content='<div class="item">📧 البريد الإلكتروني <b style="overflow-wrap:anywhere">'+safeText(window.lammaUser?.email)+'</b></div><div class="item" style="display:block">🆔 الآيدي الخاص بك<div data-account-id style="direction:ltr;overflow-wrap:anywhere;margin:10px 0;color:#ffdc8b">جاري تحميل الآيدي…</div><button class="btn" data-copy-account-id disabled onclick="copyLammaId()">📋 نسخ الآيدي</button><button class="btn" data-retry-account-id hidden onclick="loadLammaAccountId()">إعادة المحاولة</button></div><div class="item">👤 الصورة الشخصية <button class="btn" onclick="document.getElementById(&#39;avatarUpload&#39;).click()">تغيير الصورة</button></div><div class="item"><button class="btn" onclick="show(&quot;profile&quot;)">👑 حسابي</button></div><div class="item"><button class="btn" style="width:100%;background:linear-gradient(#b43d65,#6c1b43)" onclick="lammaLogout()">🚪 تسجيل الخروج</button></div>';if(page==='messages')content=window.renderLammaMessages();o.innerHTML=`<header class="app-page-header"><button type="button" onclick="show(\'home\')" aria-label="العودة للرئيسية">‹</button><h1>${title}</h1></header>${content}`;}if(page==='messages')window.mountLammaMessages?.();if(page==='events')window.mountLammaEvents?.();if(page==='games')window.mountLammaGames?.();if(page==='profile'){window.refreshLammaProfilePhoto?.();}if(page==='profile'||page==='settings'){window.renderLammaAccountId?.();window.loadLammaAccountId?.();}if(page==='shop'||page==='home'){window.paintLammaBalances?.();window.refreshDiamonds?.();}window.loadLammaGold?.();window.paintLammaGold?.();window.scrollTo(0,0)}

function councilChatMessageId(){

}
