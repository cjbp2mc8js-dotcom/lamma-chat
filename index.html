function show(page){document.querySelectorAll('#home,#room,#other').forEach(el=>el.classList.add('hidden'));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home'||page==='room'){document.getElementById(page).classList.remove('hidden');}else{const o=document.getElementById('other');o.classList.remove('hidden');let title={games:'🎮 الألعاب',friends:'👥 الأصدقاء',tasks:'📋 المهام',wallet:'💎 المحفظة',messages:'✉️ الرسائل',profile:'👑 حسابي'}[page]||page;let content='';if(page==='games')content='<div class="grid">'+gameNames.map(g=>`<button class="tile" onclick="modal('coming')">${g}<div class="tiny">عرض تجريبي</div></button>`).join('')+'</div>';if(page==='friends')content='<div class="item">👥 الأصدقاء <b>0 / 200</b></div><p>البحث والإضافة والموافقة تحتاج ربط الحسابات الحقيقي.</p>';if(page==='tasks')content=['🎁 صندوق الحضور اليومي','🎮 العب 3 جولات','🏅 احصل على شارة لعبة','🏆 أكمل مهام الأسبوع'].map(t=>`<div class="item">${t}<span>قريباً</span></div>`).join('');if(page==='wallet')content='<p>الجواهر للدعم والزينة وتطوير الرومات، والذهب للألعاب فقط.</p>'+[['$1','450 جوهرة'],['$3','1,450 جوهرة'],['$10','5,200 جوهرة']].map(x=>`<div class="item">${x[0]}<b>${x[1]}</b></div>`).join('')+'<p class="note">الشحن والسحب غير مفعّلين في النسخة التجريبية.</p>';if(page==='profile')content='<div class="item">👤 الصورة الشخصية <button class="btn" onclick="document.getElementById(\'avatarUpload\').click()">تغيير الصورة</button></div>'+ '<div class="item">👑 رويال <b>المستوى 0</b></div><div class="item">🏅 شاراتي <b>3 خانات</b></div><div class="item">👣 زوار البروفايل</div><div class="item">🖼️ معرض الصور <b>رويال 2 فما فوق</b></div>';if(page==='messages')content='<p>هنا راح تظهر المحادثات بعد ربط تسجيل الدخول وقاعدة البيانات.</p>';o.innerHTML=`<h1>${title}</h1>${content}<p class="note">نسخة تصميم تفاعلية بدون معاملات مالية أو حسابات حقيقية.</p>`;}window.scrollTo(0,0)}
function modal(type){let h='';if(type==='support')h='<h2>🏆 كأس الدعم</h2><div class="item">💎 مجموع دعم الروم <b>1,250,000</b></div><p class="note">أسماء الداعمين تظهر فقط داخل الكأس؛ الأرقام والأسماء هنا توضيحية.</p>'+['🥇 أحمد — 520,100','🥈 سارة — 430,500','🥉 علي — 310,800'].map(x=>`<div class="item">${x}</div>`).join('');else if(type==='minigames')h='<h2>🎮 ألعاب الروم المصغرة</h2><div class="grid">'+mini.map(x=>`<button class="tile" onclick="modal('coming')">${x}</button>`).join('')+'</div>';else if(type==='chat')h='<h2>💬 دردشة الروم</h2><p>الدردشة المباشرة تحتاج خدمة حسابات ورسائل.</p>';else h='<h2>👑 لمة شات</h2><p>هذه واجهة تجريبية، اللعبة الحقيقية تحتاج برمجة متعددة اللاعبين.</p>';document.getElementById('modalcontent').innerHTML=h;document.getElementById('overlay').classList.add('on')}
function setAvatar(input){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('اختار صورة فقط');return}const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const canvas=document.createElement('canvas');canvas.width=220;canvas.height=220;const ctx=canvas.getContext('2d');const m=Math.min(image.width,image.height);ctx.drawImage(image,(image.width-m)/2,(image.height-m)/2,m,m,0,0,220,220);const data=canvas.toDataURL('image/jpeg',.78);document.getElementById('avatarPreview').style.backgroundImage=`url("${data}")`;try{localStorage.setItem('lammaAvatarDemo',data)}catch(e){} };image.src=reader.result};reader.readAsDataURL(f)}
try{const saved=localStorage.getItem('lammaAvatarDemo');if(saved)document.getElementById('avatarPreview').style.backgroundImage=`url("${saved}")`}catch(e){}
function closeModal(){document.getElementById('overlay').classList.remove('on')}
