/* Council text chat owns its admission lease independently of Agora audio. */
function councilChatMessageId(){
 if(typeof crypto.randomUUID==='function')return crypto.randomUUID();
 const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;

}

 }

  const drawGifts=filter=>{const visible=giftItems.filter(g=>filter==='الكل'||g.group===filter);if(!visible.some(g=>g.id===selectedGift))selectedGift=visible[0].id;const grid=gallery.querySelector('.gift-grid');giftObserver?.disconnect();grid.replaceChildren();grid.scrollTop=0;for(const item of visible){const button=document.createElement('button');button.type='button';button.className='gift-card'+(item.animated?' is-animated motion-'+item.motion:'');button.dataset.gift=item.id;button.innerHTML=giftArt(item);const name=document.createElement('span');name.className='gift-name';name.textContent=item.name;const price=document.createElement('span');price.className='gift-price';price.textContent=giftNumber(item.price);const gem=document.createElement('i');gem.className='gift-gem';gem.setAttribute('aria-hidden','true');price.appendChild(gem);button.append(name,price);if(item.animated){const badge=document.createElement('small');badge.className='gift-motion-badge';badge.textContent='متحركة';button.appendChild(badge);}button.setAttribute('aria-label',item.name+'، '+giftNumber(item.price)+' ألماسة'+(item.animated?'، متحركة':''));button.onclick=()=>chooseGift(item.id);grid.appendChild(button);if(giftObserver)giftObserver.observe(button);else button.classList.add('in-view');}for(const button of gallery.querySelectorAll('.gift-filters button'))button.setAttribute('aria-pressed',String(button.textContent===filter));chooseGift(selectedGift);};
  for(const filter of ['الكل','كلاسيكي','رومانسية','حلويات','رويال','طبيعة','احتفالات','مغامرات']){const button=document.createElement('button');button.type='button';button.textContent=filter;button.onclick=()=>drawGifts(filter);gallery.querySelector('.gift-filters').appendChild(button);}drawGifts('الكل');
  stage.querySelector('#councilGifts').onclick=()=>gallery.showModal();
  gallery.addEventListener('click',e=>{if(e.target===gallery){const r=gallery.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)gallery.close();}});
  const toolDialog=document.createElement('dialog');toolDialog.id='councilToolDialog';toolDialog.className='mic-profile';const toolTitle=document.createElement('h3'),toolText=document.createElement('p'),toolClose=document.createElement('button');toolClose.textContent='رجوع للمجلس';toolClose.onclick=()=>toolDialog.close();toolDialog.append(toolTitle,toolText,toolClose);stage.appendChild(toolDialog);
  for(const [id,title,text]of [['councilMusic','الموسيقى','تشغيل الموسيقى ومشاركتها داخل المجلس غير مفعّل بعد.']]){const button=stage.querySelector('#'+id);if(button)button.onclick=()=>{toolTitle.textContent=title;toolText.textContent=text;toolDialog.showModal();};}
  const menu=document.createElement('dialog');menu.id='ownMicMenu';menu.className='mic-menu';menu.setAttribute('aria-label','خيارات المايك');
  const exit=document.createElement('button');control(exit,'mic','الخروج من المايك');exit.onclick=()=>{menu.close();Promise.resolve(voice.down()).catch(()=>update({message:'تعذر النزول من المايك. حاول ثانية.'}));};
  const profile=document.createElement('button');control(profile,'profile','فتح ملفي الشخصي');profile.onclick=()=>{menu.close();const info=stage.querySelector('#councilOwnProfile');if(info)info.showModal();};menu.append(exit,profile);stage.appendChild(menu);
  const info=document.createElement('dialog');info.id='councilOwnProfile';info.className='mic-profile';info.setAttribute('aria-label','ملفي الشخصي');const title=document.createElement('h3');title.textContent=window.lammaUser?.displayName||window.lammaUser?.email?.split('@')[0]||'ملفي الشخصي';const uid=document.createElement('p');uid.dataset.accountId='';uid.textContent=window.lammaPublicId||'جاري تحميل الآيدي…';uid.dir='ltr';window.loadLammaAccountId?.().then(()=>window.renderLammaAccountId?.());const close=document.createElement('button');close.textContent='رجوع للمجلس';close.onclick=()=>info.close();info.append(title,uid,close);stage.appendChild(info);
  for(const dialog of [menu,info,toolDialog,effect])dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
  update({message:'جاري اتصال صوت المجلس...'});voice.join(id);
 };
 const originalShow=window.show;window.show=function(page){chat?.stop();window.lammaRoomEpoch=(window.lammaRoomEpoch||0)+1;voice.leave();return originalShow(page);};
 const originalRender=window.renderRooms;window.renderRooms=function(){chat?.stop();window.lammaRoomEpoch=(window.lammaRoomEpoch||0)+1;voice.leave();return originalRender();};
 const originalManage=window.openMyRoom;window.openMyRoom=function(){chat?.stop();window.lammaRoomEpoch=(window.lammaRoomEpoch||0)+1;voice.leave();return originalManage();};
 const originalLogout=window.lammaLogout;window.lammaLogout=async()=>{chat?.stop();await voice.leave();return originalLogout();};
 window.addEventListener('pagehide',()=>{chat?.stop();voice.leave();});
 window.addEventListener('pageshow',e=>{if(e.persisted&&document.querySelector('.council-stage')){chat?.start();update({message:'اضغط إعادة اتصال الصوت للرجوع للمجلس.'});}});
};
if(window.lammaAppReady)mountRoyalVoice();
else window.addEventListener("lamma-app-ready",mountRoyalVoice,{once:true});

</script>
